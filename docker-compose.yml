services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mudac}
      POSTGRES_USER: ${POSTGRES_USER:-mudac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mudac-local}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mudac} -d ${POSTGRES_DB:-mudac}']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mudac-postgres:/var/lib/postgresql/data

volumes:
  mudac-postgres:
