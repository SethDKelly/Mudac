name: Knowledge Validation

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "requirements-docs.txt"
      - "scripts/**"
      - "docs/**"
      - "knowledge/**"
      - ".github/workflows/knowledge-validation.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "requirements-docs.txt"
      - "scripts/**"
      - "docs/**"
      - "knowledge/**"
      - ".github/workflows/knowledge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge:
    name: Validate knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation validation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Validate MUDAC authored knowledge structure
        run: python scripts/validate_knowledge.py

      - name: Check generated OKF projection
        run: python scripts/generate_okf_projection.py --check

      - name: Check generated owner inventory
        run: python scripts/generate_owner_inventory.py --check

      - name: Check generated stable-reference index
        run: python scripts/generate_stable_reference_index.py --check

      - name: Check agentic authority policy
        run: python scripts/validate_agentic_authority_policy.py

      - name: Measure context budgets
        run: python scripts/measure_context_budget.py

      - name: Smoke-test stable-ID resolution roles
        shell: bash
        run: |
          python scripts/resolve_stable_id.py INV-001
          if python scripts/resolve_stable_id.py ARCH-001; then
            echo "ARCH-001 unexpectedly resolved as current authority"
            exit 1
          fi
          python scripts/resolve_stable_id.py ARCH-001 --include-candidates
