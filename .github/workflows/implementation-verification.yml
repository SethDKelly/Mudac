name: Implementation Verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'phase-006-*'

permissions:
  contents: read

jobs:
  verify:
    name: Implementation Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application workspace
        run: pnpm verify

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra

      - name: Validate OpenTofu environment roots
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            infra/environments/nonproduction/us-east-2 \
            infra/environments/production/us-east-2 \
            infra/environments/recovery/us-east-1; do
            (
              cd "$root"
              tofu init -backend=false -input=false
              tofu validate
            )
          done
