name: Knowledge Validation

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "requirements-docs.txt"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/knowledge-validation.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "requirements-docs.txt"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/knowledge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge:
    name: Validate knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation validation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Validate MUDAC knowledge structure
        run: python scripts/validate_knowledge.py
