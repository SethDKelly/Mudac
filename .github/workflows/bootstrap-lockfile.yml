name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - phase-006-d-runtime-bootstrap
    paths:
      - package.json
      - pnpm-workspace.yaml
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'packages/modules/*/package.json'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-006-d-runtime-bootstrap

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m '006-D generate pnpm lockfile'
          git push origin HEAD:phase-006-d-runtime-bootstrap
