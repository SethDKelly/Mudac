name: AUT-001 Read-Only Shadow

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  shadow:
    if: github.head_ref == 'aut-001/b-read-only-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute bounded live read-only shadow
        env:
          AUT001_REPOSITORY: ${{ github.repository }}
          AUT001_REPOSITORY_ID: ${{ github.event.repository.id }}
          AUT001_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUT001_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          AUT001_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUT001_BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUT001_PACKAGE_CONTRACT_PATH: docs/routing/aut001_implementation_package_contract.json
          AUT001_EVIDENCE_PATH: /tmp/aut001-shadow/evidence.json
          AUT001_SHADOW_MAX_ATTEMPTS: '24'
          AUT001_SHADOW_INTERVAL_MS: '30000'
          AUT001_SHADOW_TIMEOUT_MS: '1200000'
        run: |
          mkdir -p /tmp/aut001-shadow
          pnpm exec tsx tools/autonomy-control/src/github/live-shadow-cli.ts
          {
            echo '## AUT-001-B live read-only shadow evidence'
            echo '```json'
            cat /tmp/aut001-shadow/evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain AUT-E03 bounded-window evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aut001-b-live-shadow-evidence-${{ github.event.pull_request.head.sha }}
          path: /tmp/aut001-shadow/evidence.json
          if-no-files-found: error
          retention-days: 30
