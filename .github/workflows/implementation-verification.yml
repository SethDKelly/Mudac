name: Implementation Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Implementation Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application workspace
        run: pnpm verify

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra

      - name: Validate OpenTofu environment roots
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            infra/environments/nonproduction/us-east-2 \
            infra/environments/production/us-east-2 \
            infra/environments/recovery/us-east-1; do
            (
              cd "$root"
              tofu init -backend=false -input=false
              tofu validate
            )
          done
