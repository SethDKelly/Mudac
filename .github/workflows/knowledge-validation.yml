name: Knowledge Validation

on:
  push:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "requirements-docs.txt"
      - "scripts/**"
      - "docs/**"
      - "knowledge/**"
      - ".agents/**"
      - ".cursor/**"
      - ".claude/**"
      - ".github/workflows/knowledge-validation.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "requirements-docs.txt"
      - "scripts/**"
      - "docs/**"
      - "knowledge/**"
      - ".agents/**"
      - ".cursor/**"
      - ".claude/**"
      - ".github/workflows/knowledge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge:
    name: Validate agentic/documentation conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation validation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Run integrated agentic/documentation conformance
        run: python scripts/run_agentic_conformance.py
